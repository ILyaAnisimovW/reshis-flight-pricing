plugins { id 'java'; id 'org.springframework.boot' version '3.5.16'; id 'io.spring.dependency-management' version '1.1.7' }
group = 'app'; version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies { implementation 'org.springframework.boot:spring-boot-starter-web'; implementation 'org.springframework.boot:spring-boot-starter-validation'; implementation 'org.springframework.boot:spring-boot-starter-security'; implementation 'org.springframework.boot:spring-boot-starter-jdbc'; implementation 'org.apache.commons:commons-csv:1.14.1'; runtimeOnly 'com.h2database:h2'; testImplementation 'org.springframework.boot:spring-boot-starter-test'; testImplementation 'org.springframework.security:spring-security-test'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
test { useJUnitPlatform() }

dependencies { runtimeOnly 'org.postgresql:postgresql' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
